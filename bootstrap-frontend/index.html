<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peplink SMS - Web UI</title>
    
    <!-- Bootstrap CSS -->
    <link href="assets/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Material Design Icons -->
    <link href="assets/css/material-icons.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-fluid h-100 p-0">
        <div class="row g-0 h-100">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 sidebar">
                <div class="sidebar-logo">
                    <img src="assets/logos/Peplink-SMS-Logo-FULL.webp" alt="Peplink SMS Logo" class="logo-img">
                </div>
                <div class="sidebar-header">
                    <h5 class="mb-0">Messages</h5>
                    <div class="sidebar-header-buttons">
                        <button class="btn btn-link text-white" id="newMessageBtn">
                            <span class="material-icons">✏️</span>
                        </button>
                        <button class="btn btn-link text-white close-sidebar-btn" id="closeSidebarBtn" title="Close">
                            <span class="material-icons">✖️</span>
                        </button>
                    </div>
                </div>
                <div class="mobile-chat-actions" id="mobileChatActions"></div>
                
                <!-- Search Bar -->
                <div class="search-bar">
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-0">
                            <span class="material-icons">🔍</span>
                        </span>
                        <input type="text" class="form-control border-0" placeholder="Search messages" id="searchInput">
                    </div>
                </div>
                
                <!-- Contacts List -->
                <div class="contacts-list" id="contactsList">
                    <div class="empty-state">Loading SMS...</div>
                </div>
            </div>
            
            <!-- Main Chat Area -->
            <div class="col-md-9 col-lg-10 main-area">
                <!-- Chat Header -->
                <div class="chat-header">
                    <div class="d-flex align-items-center chat-header-left">
                        <button class="btn btn-link text-dark mobile-menu-btn" id="sidebarToggleBtn" title="Menu">
                            <span class="material-icons">☰</span>
                        </button>
                        <div class="contact-avatar me-3">
                            <span class="material-icons">👤</span>
                        </div>
                        <div>
                            <h6 class="mb-0" id="currentContactName">No Contact Selected</h6>
                            <small class="text-muted" id="currentContactPhone"></small>
                        </div>
                    </div>
                    <div class="chat-actions" id="chatActions">
                        <button class="btn btn-link text-dark" id="infoBtn" title="Info">
                            <span class="material-icons">ℹ️</span>
                        </button>
                        <div class="theme-toggle-container">
                            <button class="theme-toggle-btn" id="themeToggleBtn" title="Theme">
                                <span class="material-icons" id="themeIcon">🌙</span>
                            </button>
                            <div class="theme-dropdown" id="themeDropdown">
                                <button class="theme-option" data-theme="light">
                                    <span class="material-icons">☀️</span>
                                    <span>Light Mode</span>
                                </button>
                                <button class="theme-option" data-theme="dark">
                                    <span class="material-icons">🌙</span>
                                    <span>Dark Mode</span>
                                </button>
                                <button class="theme-option" data-theme="auto">
                                    <span class="material-icons">💻</span>
                                    <span>Auto</span>
                                </button>
                            </div>
                        </div>
                        <div class="more-menu">
                            <button class="btn btn-link text-dark" id="moreBtn" title="More">
                                <span class="material-icons">⋮</span>
                            </button>
                            <div class="more-dropdown" id="moreDropdown">
                                <button class="dropdown-option" data-action="settings">
                                    <span class="material-icons">⚙️</span>
                                    <span>Settings</span>
                                </button>
                                <button class="dropdown-option" data-action="logout">
                                    <span class="material-icons">🚪</span>
                                    <span>Logout</span>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div id="chatActionsDesktopPlaceholder"></div>
                </div>
                
                <!-- Messages Container -->
                <div class="messages-container" id="messagesContainer">
                    <div class="empty-state-message">
                        <p>Select a conversation to display your SMS messages.</p>
                    </div>
                </div>
                
                <!-- Message Input Area -->
                <div class="message-input-area">
                    <input type="text" class="form-control message-input" id="messageInput" placeholder="Type a message...">
                    <button class="btn btn-primary send-btn" id="sendBtn">
                        <span class="material-icons">➤</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <div class="compose-modal" id="composeModal">
        <div class="compose-modal-dialog">
            <div class="compose-modal-header">
                <h5>New Message</h5>
                <button type="button" class="btn-close" id="composeCloseBtn" aria-label="Close">&times;</button>
            </div>
            <form id="composeForm">
                <div class="compose-modal-body">
                    <div class="mb-3">
                        <label for="composePhoneInput" class="form-label">Phone Number</label>
                        <input type="text" class="form-control" id="composePhoneInput" placeholder="+1234567890" required>
                    </div>
                    <div class="mb-3">
                        <label for="composeMessageInput" class="form-label">Message</label>
                        <textarea class="form-control" id="composeMessageInput" rows="3" placeholder="Type your message..." required></textarea>
                    </div>
                    <div class="compose-error text-danger" id="composeError"></div>
                </div>
                <div class="compose-modal-footer">
                    <button type="button" class="btn btn-outline-secondary" id="composeCancelBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="composeSendBtn">Send</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Bootstrap JS -->
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JS -->
    <script src="script.js"></script>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
</body>
</html>
